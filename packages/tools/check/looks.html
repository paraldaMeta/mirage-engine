<!doctype html>
<!-- Mirage original code. Test scenes for looks.check.mjs, served from the repository root (no build): ?scene=metals |
     alpha | fur | moss | play (createPlay over the fur scene, ?motion=auto|on|off); ?w=&h=. Exposes window.__mirage = { world, scene objects } and sets window.__READY. -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>mirage looks check</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
<script type="importmap">{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "@miragekit/core": "/packages/core/src/index.js",
  "@miragekit/core/lifetime": "/packages/core/src/lifetime.js",
  "@miragekit/core/geom": "/packages/core/src/geom.js",
  "@miragekit/core/materials": "/packages/core/src/materials.js",
  "@miragekit/core/rng": "/packages/core/src/rng.js",
  "@miragekit/core/stream": "/packages/core/src/stream.js",
  "@miragekit/core/world": "/packages/core/src/world.js",
  "@miragekit/world": "/packages/world/src/index.js",
  "@miragekit/play": "/packages/play/src/index.js",
  "@miragekit/world/kits/fur": "/packages/world/src/kits/fur.js",
  "@miragekit/world/kits/vegetation": "/packages/world/src/kits/vegetation.js"
} }</script>
</head><body><canvas></canvas>
<script type="module">
import * as THREE from 'three';
import { createWorldRenderer, PROC, rng } from '@miragekit/core';
import { addFur } from '@miragekit/world/kits/fur';
import { addGrass } from '@miragekit/world/kits/vegetation';

const Q = new URLSearchParams(location.search), scene = Q.get('scene') || 'metals';
const W = +Q.get('w') || 960, H = +Q.get('h') || 540, canvas = document.querySelector('canvas');
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
const world = createWorldRenderer({ canvas, width: W, height: H, time: 'golden', preserveDrawingBuffer: true, quality: 'high',
  shadow: { center: [0, 0, 0], radius: 5 }, envProbe: [0, 1.2, 2], post: { grain: 0 }, wind: { dir: [1, 0.3], strength: 1.5 } });
const { mat, camera } = world, root = new THREE.Group();
world.scene.add(root);
const ctx = { ...world.ctx, root, rng: (n) => rng('looks/' + n) };
const add = (geo, m, pos, rot = [0, 0, 0]) => { const o = new THREE.Mesh(geo, m); o.position.set(...pos); o.rotation.set(...rot); o.castShadow = o.receiveShadow = true; root.add(o); return o; };
const out = {};
camera.aspect = W / H; camera.fov = 40; camera.near = 0.05; camera.far = 500;

if (scene === 'metals') {
  add(new THREE.PlaneGeometry(14, 10).rotateX(-Math.PI / 2), mat.std({ roughness: 0.95 }, PROC.plaster('vec3(0.5, 0.47, 0.42)')), [0, 0, 0]);
  const kinds = [
    ['plain', mat.std({ color: new THREE.Color(0.56, 0.57, 0.58), metalness: 1, roughness: 0.3 })],
    ['brushed', mat.std({ metalness: 1, roughness: 0.3 }, PROC.brushed())],
    ['hammered', mat.std({ metalness: 1, roughness: 0.22 }, PROC.hammered('vec3(0.78, 0.45, 0.3)'))],
    ['patina', mat.std({ metalness: 1, roughness: 0.3 }, PROC.patina())],
  ];
  kinds.forEach(([name, m], i) => {
    const x = (i - 1.5) * 1.25;
    out[name] = add(new THREE.SphereGeometry(0.45, 96, 64), m, [x, 0.5, 0]);
    add(new THREE.BoxGeometry(1.0, 0.9, 0.04), m, [x, 0.5, -0.9], [0, 0, 0]);
  });
  camera.position.set(0.2, 1.35, 3.6); camera.lookAt(0, 0.5, -0.3);
} else if (scene === 'alpha') {
  // one object in empty air: a torus knot (thin parts, holes) and a sphere behind it, nothing else
  out.knot = add(new THREE.TorusKnotGeometry(0.55, 0.16, 220, 32), mat.std({ roughness: 0.4 }, PROC.terracotta()), [0, 1.2, 0]);
  out.ball = add(new THREE.SphereGeometry(0.35, 64, 32), mat.std({ metalness: 1, roughness: 0.25 }, PROC.brushed()), [1.1, 0.8, -0.6]);
  camera.position.set(0, 1.3, 3.4); camera.lookAt(0.2, 1.05, 0);
} else if (scene === 'fur' || scene === 'tufts' || scene === 'play') {
  add(new THREE.PlaneGeometry(14, 10).rotateX(-Math.PI / 2), mat.std({ color: new THREE.Color(0.09, 0.12, 0.04), roughness: 0.97 }), [0, 0, 0]);
  const lawn = [-2, -2.5, 2, 1.5];
  if (scene !== 'tufts') out.fur = addFur(ctx, { rect: lawn, y: 0.002, fins: Q.has('fins') ? 0.3 : false, shells: +Q.get('shells') || 16 });
  else out.tufts = addGrass(ctx, { bounds: lawn, count: +Q.get('count') || 2400, height: 0.12 });
  camera.position.set(0.3, 1.1, 3.0); camera.lookAt(0, 0.05, -0.4);
} else if (scene === 'moss') {
  add(new THREE.PlaneGeometry(14, 10).rotateX(-Math.PI / 2), mat.std({ roughness: 0.95 }, PROC.stone()), [0, 0, 0]);
  const rock = new THREE.IcosahedronGeometry(0.7, 4).scale(1.3, 0.75, 1).translate(0, 0.35, 0);
  add(rock, mat.std({ roughness: 0.9 }, PROC.stone('vec3(0.36, 0.34, 0.3)')), [0, 0, 0]);
  out.moss = addFur(ctx, { geometry: rock, shells: 12, length: 0.025, density: 3000, thickness: 0.55, root: [0.02, 0.035, 0.008], tip: [0.12, 0.2, 0.04], wind: 0.3 });
  camera.position.set(0.9, 1.2, 2.2); camera.lookAt(0, 0.4, 0);
}
camera.updateProjectionMatrix();
await world.prepare();
if (scene === 'play') {
  const { createPlay } = await import('@miragekit/play');
  const m = Q.get('motion') || 'auto', plan = { name: 'looks', bounds: [-6, -6, 6, 6], viewpoints: [], spawn: { eye: [0.3, 1.62, 3], look: [0, 0.05, -0.4] } };
  out.play = createPlay(world, { plan, ui: false, hud: false, reducedMotion: { auto: 'auto', on: true, off: false }[m] });
}
window.__mirage = { world, out, THREE };
window.__READY = true;
</script></body></html>
