  <style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; } canvas { display: block; }
    /* the poster (#boot): a still of the title's first shot and the title's menu, painted before any code loads (pure
       HTML / CSS: the bundle is not render-blocking). main.js takes the menu away when the real title is up, and fades
       the still once the 3D title draws. A tap on DEPLOY (or Enter) queues the start, OPTIONS opens them when ready. */
    #boot { position: fixed; inset: 0; z-index: 5; background: #05080f center right / cover no-repeat; color: #d8f6ff; font: 600 13px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; transition: opacity .5s; -webkit-user-select: none; user-select: none; --pad: max(28px, env(safe-area-inset-left)) }
    #boot.under { pointer-events: none } #boot.under .pb-shade, #boot.under .pb-main { display: none } #boot.gone { opacity: 0 }
    .pb-shade { position: absolute; inset: 0; background: linear-gradient(90deg,#02060af5 0%,#02060ae0 26%,#02060a80 46%,#02060a00 66%),linear-gradient(0deg,#02060ad0 0%,#02060a00 34%) }
    .pb-main { position: absolute; left: var(--pad); top: 50%; transform: translateY(-52%); width: min(430px, calc(100vw - 2 * var(--pad))) }
    .pb-main svg { display: block; width: 68px; height: 68px; margin: 0 0 12px -9px }
    #boot h1 { margin: 0 0 24px; font: 800 66px/.9 ui-monospace, SFMono-Regular, Menlo, "PingFang TC", monospace; letter-spacing: .02em; color: #f4feff; text-shadow: -2px 0 #ff3fd270, 2px 0 #19d8ff70, 0 0 30px #19d8ff3a }
    #boot h1 span { display: block }
    #boot button { all: unset; box-sizing: border-box; display: flex; align-items: center; width: 100%; height: 40px; margin-bottom: 5px; padding-left: 16px; cursor: pointer; border: 1px solid #19d8ff1c; background: linear-gradient(90deg,#071823d0,#07182340); font-size: 11px; letter-spacing: .22em; color: #d8f6ffd0 }
    #boot .pb-go { height: 52px; margin-bottom: 11px; padding-left: 18px; border-color: #19d8ff; font-size: 17px; letter-spacing: .42em; color: #02080d; font-weight: 800; box-shadow: 0 0 24px #19d8ff30;
      background: linear-gradient(90deg,#19d8ffe8,#19d8ffe8) no-repeat 0 0 / var(--p,8%) 100%, #19d8ff30; transition: background-size .8s }
    .pb-go:before { content: ""; margin-right: 16px; border: 7px solid transparent; border-left: 11px solid #02080d; border-right: 0 }
    .pb-desc { margin: 12px 0 0; font: 400 12px/1.45 system-ui, -apple-system, sans-serif; color: #d8f6ffa8 }
    @media (max-height: 520px) { #boot { --pad: max(18px, env(safe-area-inset-left)) } .pb-main { top: max(30px, env(safe-area-inset-top)); transform: none; width: min(390px, 52vw) }
      .pb-main svg { float: left; width: 36px; height: 36px; margin: -4px 8px 0 -5px } #boot h1 { font-size: 30px; margin-bottom: 14px } #boot h1 span { display: inline } #boot h1 span + span:before { content: " " }
      #boot button { height: 36px; margin-bottom: 3px } #boot .pb-go { height: 40px; font-size: 14px; margin-bottom: 6px } .pb-desc { margin-top: 6px; font-size: 11px } }
</style>

  <script>{ performance.mark('nd:poster');
    const b = document.getElementById('boot'), go = b.querySelector('.pb-go'), d = b.querySelector('.pb-desc'), q = new URLSearchParams(location.search), l = q.get('lang') || navigator.language;
    const L = /^zh/.test(l) ? ['霓虹街區', '出擊', '設定'] : /^ja/.test(l) ? ['ネオン街区', '出撃', 'オプション'] : null;
    if (L) { b.querySelector('h1').textContent = L[0]; go.textContent = L[1]; b.querySelector('#pb-opt').textContent = L[2]; }
    // a tap on DEPLOY (or Enter / Space) before the world is ready starts the game the moment it is; OPTIONS opens them then
    const deploy = () => { window.__ndTap = true; go.style.setProperty('--p', '100%'); d.textContent = '▶ …'; };
    go.addEventListener('click', deploy); b.querySelector('#pb-opt').addEventListener('click', () => { window.__ndOpts = true; });
    addEventListener('keydown', (e) => { if (b.isConnected && !b.classList.contains('under') && (e.code === 'Enter' || e.code === 'Space')) deploy(); });
    let n = 0; const tick = setInterval(() => { if (!b.isConnected || b.classList.contains('under')) clearInterval(tick); else if (!window.__ndTap) { n++; go.style.setProperty('--p', Math.min(60, 8 + n * 6) + '%'); if (n > 2) d.textContent = n + ' s'; } }, 1000); }</script>
