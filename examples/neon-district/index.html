<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mirage · neon-district</title>
  <style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; } canvas { display: block; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: #e8eef4; font: 15px/1.5 system-ui, sans-serif; background: #000; z-index: 5 }
    #boot h1 { font-weight: 600; letter-spacing: .06em; margin: 0 0 6px; font-size: 28px } #boot p { margin: 0; opacity: .6 }</style>
</head>
<body>
  <canvas></canvas>
  <!-- shown at once, while the code and the world load; main.js removes it when the title is up -->
  <div id="boot"><div><img src="./logo.svg" alt="" width="96" height="96" style="display:block;margin:0 auto 14px" onerror="this.remove()"><h1>NEON DISTRICT</h1><p>loading</p></div></div>
  <script>if (/^(zh|ja)/.test(new URLSearchParams(location.search).get('lang') || navigator.language)) { const z = /^zh/.test(new URLSearchParams(location.search).get('lang') || navigator.language); document.querySelector('#boot h1').textContent = z ? '霓虹街區' : 'ネオン街区'; document.querySelector('#boot p').textContent = '…'; }</script>
  <script>{ const b = document.getElementById('boot'), p = b.querySelector('p'); let t = false, n = 0; const go = (e) => { if (t || e.target.isContentEditable) return; t = true; window.__ndTap = true; p.textContent = '…'; }; b.addEventListener('pointerdown', go); addEventListener('keydown', go); const tick = setInterval(() => { if (!b.isConnected) clearInterval(tick); else if (!t && ++n > 3) p.textContent = n + ' s'; }, 1000); }</script>   <!-- a tap or key before the world is ready starts the game the moment it is -->
  <script type="module" src="./main.js"></script>
</body>
</html>
