<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirage · destructibles</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8e4dc; }
    canvas { display: block; cursor: crosshair; }
    #bar { position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 70vw; }
    button { font: inherit; color: inherit; background: #1c1a17cc; border: 1px solid #5a554c; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
    button.on { background: #e8e4dc; color: #1c1a17; }
    #tally { position: fixed; right: 10px; top: 10px; background: #1c1a17cc; padding: 6px 9px; border-radius: 4px; white-space: pre; min-width: 220px; }
    #stats { position: fixed; left: 10px; bottom: 10px; background: #1c1a17cc; padding: 6px 9px; border-radius: 4px; white-space: pre; }
    #cross { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 1px solid #fff8; border-radius: 50%; pointer-events: none; }
  </style>
</head>
<body>
  <canvas></canvas>
  <div id="bar">
    <button id="pistol" class="on">click: pistol</button>
    <button id="shotgun">S / shift-click: shotgun</button>
    <button id="rocket">B: blast at the aim</button>
    <button id="reset">R: reset</button>
    <button id="save">K: snapshot</button>
    <button id="load">L: restore</button>
    <button id="detail">D: detail 1</button>
  </div>
  <div id="cross"></div>
  <div id="tally"></div>
  <div id="stats"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
