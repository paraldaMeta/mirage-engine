# check: what needs no GPU: the engine's node checks, lint, export maps, declarations, the docs index, the package
#   contents, every example's build and the browser helpers in headless Chrome (no WebGL on these pages).
# software-gl: frames drawn on the runner's CPU (Chrome with SwiftShader): two examples are played, two views of
#   each must redraw bit-identically, and five stills are compared with committed baselines. No timing is gated.
# The GPU end-to-end run (`npm run test:e2e`, gpu-acceptance.yml) needs a runner with a GPU (docs/GPU-CI.md).
# Every action is pinned to a full commit SHA; the token is read-only.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:pack
      - run: npm run build:examples
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs
      - if: runner.os == 'Linux'
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: node packages/tools/check.mjs
  software-gl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w examples/hello-courtyard -w examples/snow-hut
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox needs
      - run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - run: npm run test:software-gl
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: software-gl
          path: out/ci
          retention-days: 7
